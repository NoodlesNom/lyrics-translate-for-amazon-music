<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 270px; padding: 14px 16px; background: #0f1111; color: #fff;
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  label { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  select { background: #1c1f20; color: #fff; border: 1px solid #3a3f41; border-radius: 6px; padding: 4px 6px; max-width: 150px; }
  input[type=checkbox] { accent-color: #25d1da; width: 16px; height: 16px; }
  p { margin: 12px 0 0; color: rgba(255,255,255,.5); font-size: 11px; }
  a { color: #25d1da; }
  .status { margin: -4px 0 8px; font-size: 11px; color: rgba(255,255,255,.6); }
  #counter { margin: 12px 0 0; }
  #force { width: 100%; margin: 2px 0 6px; padding: 5px; background: #1c1f20; color: #fff; border: 1px solid #3a3f41; border-radius: 6px; font: inherit; cursor: pointer; }
  #force:disabled { opacity: .45; cursor: default; }
  #forceMsg:empty { display: none; }
  .note { color: #25d1da; } .note[data-kind=none], .note[data-kind=error] { color: #ffb300; }
  .note[data-kind=amazon], .note[data-kind=checking], .note[data-kind=off] { color: rgba(255,255,255,.6); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #8a8f91; }
  [data-state=green] .dot { background: #3ddc84; } [data-state=amber] .dot { background: #ffb300; } [data-state=red] .dot { background: #ff5252; }
</style>
</head>
<body>
  <h1>Lyrics Translate</h1>
  <label>Translate to
    <select id="tl">
      <option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option>
      <option value="nl">Dutch</option><option value="pl">Polish</option><option value="sv">Swedish</option>
      <option value="tr">Turkish</option><option value="uk">Ukrainian</option><option value="ru">Russian</option>
      <option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh-CN">Chinese (Simplified)</option>
      <option value="zh-TW">Chinese (Traditional)</option><option value="ar">Arabic</option><option value="he">Hebrew</option>
      <option value="hi">Hindi</option><option value="th">Thai</option><option value="vi">Vietnamese</option>
      <option value="id">Indonesian</option><option value="tl">Filipino</option>
    </select>
  </label>
  <label>Translator
    <select id="translator">
      <option value="gemini">Gemini (needs key)</option>
      <option value="google">Google Translate</option>
    </select>
  </label>
  <div id="gstate" class="status" data-state="gray"><span class="dot"></span><span id="glabel"></span></div>
  <div id="song" class="status">This song: nothing playing in Amazon Music.</div>
  <div id="lrcNote" class="status note" hidden></div>
  <button id="force" disabled title="Open a song's lyrics in Amazon Music first">Translate this song</button>
  <div id="forceMsg" class="status"></div>
  <label>Text size
    <select id="size">
      <option value="0.85">Small</option><option value="1">Default</option><option value="1.2">Large</option><option value="1.45">Extra large</option>
    </select>
  </label>
  <label>Show romanization <input type="checkbox" id="rom"></label>
  <label>Show translation <input type="checkbox" id="trans"></label>
  <label>Show original lyrics <input type="checkbox" id="orig"></label>
  <label>Show floating button <input type="checkbox" id="float"></label>
  <label title="When Amazon has no lyrics for a song, look it up on LRCLIB (lrclib.net) and show them in Amazon's full view, where its lyrics normally appear">Find lyrics when Amazon has none <input type="checkbox" id="lrclib"></label>
  <div id="counter" class="status" title="Per translator: songs fully translated into the selected language"></div>
  <p>Lyric lines are sent to Google (Translate, or Gemini if chosen) to be translated. For songs Amazon has no lyrics for, the title, artist and duration are sent to LRCLIB. <a href="#" id="settings">Settings</a></p>
  <script src="popup.js"></script>
</body>
</html>
