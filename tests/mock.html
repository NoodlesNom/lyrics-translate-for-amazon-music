  };
  const H4_STYLE = 'font-family: EmberModernDisplayStd-Bold; font-size: 24px; color: rgba(255, 255, 255, 0.3); text-align: right; direction: ltr; padding: 6px 12px; border-radius: 12px;';
  const ACTIVE = 'font-family: EmberModernDisplayStd-Bold; font-size: 24px; color: rgb(255, 255, 255); text-align: right; direction: ltr; padding: 6px 12px; border-radius: 12px; background-color: rgb(26, 111, 209);';

  function makeRow(t) {

    const h4 = document.createElement('h4');
    for (const [k, v] of Object.entries({ dir: 'auto', 'aria-hidden': 'true', 'aria-level': '4', role: 'heading', tabindex: '-1', class: 'css-1jxf684 r-13awgt0 r-1qd0xha', style: H4_STYLE })) h4.setAttribute(k, v);

  const stTitle = stage.querySelector('[data-testid="Stage_Title"]'), stArtist = stage.querySelector('[data-testid="Stage_Subtitle"] a');
  // Mini-player while the full view is open (?stagemini=): gone (default: its title/artist cluster is unmounted, the bar

      mini.style.display = '';

    else stage.remove();                             // React unmounts the full view

      if (lyrics) el.append(badge('Lyrics available', 'LYRICS'));

    if (!params.has('nomedia') && 'mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title, artist: s.artist });

    stTitle.setAttribute('aria-label', title); stTitle.textContent = title;

  const fmt = (x) => { x = Math.floor(x); const h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), ss = String(x % 60).padStart(2, '0'); return h ? h + ':' + String(m).padStart(2, '0') + ':' + ss : m + ':' + ss; };

  const player = window.mockPlayer = {
    pos: 0, dur: 0, playing: true, t0: performance.now(),
    now() { return this.playing ? Math.min(this.dur, this.pos + (performance.now() - this.t0) / 1000) : this.pos; },
    load(dur) { this.dur = dur; this.pos = Number(params.get('start')) || 0; this.t0 = performance.now(); this.playing = !params.has('paused'); this.render(); },
    seek(x) { this.pos = x; this.t0 = performance.now(); this.render(); },
    pause() { this.pos = this.now(); this.playing = false; this.render(); },
    play() { this.t0 = performance.now(); this.playing = true; this.render(); },
    render() {
      const sl = sliderEl;
      const x = this.now();
      const set = (a, v) => { if (sl.getAttribute(a) !== v) sl.setAttribute(a, v); };
      set('aria-label', 'Playback ' + fmt(x) + ' of ' + fmt(this.dur));
      if (sliderMode === 'label') { sl.removeAttribute('aria-valuenow'); sl.removeAttribute('aria-valuemax'); }
      else { const k = sliderMode === 'ms' ? 1000 : 1; set('aria-valuenow', String(Math.floor(x) * k)); set('aria-valuemax', String(this.dur * k)); }
      sl.firstChild.style.width = (this.dur ? (x / this.dur) * 100 : 0) + '%';
      const pb = pauseEl;
      if (pb.getAttribute('aria-label') !== (this.playing ? 'Pause' : 'Play')) pb.setAttribute('aria-label', this.playing ? 'Pause' : 'Play');
    },
  };
  setInterval(() => player.render(), 250);
  // Renders a song in chunks (3 lines, then one more every 150 ms), like a list that fills in progressively.
  window.setSongChunked = (n) => {
    const s = SONGS[n]; current = n; setMeta(s);
    const list = renderList(s.lines.slice(0, 3));
    s.lines.slice(3).forEach((t, i) => setTimeout(() => list.appendChild(makeRow(t)), 150 * (i + 1)));
  };
  window.setSong = (n) => { const s = SONGS[n]; current = n; setMeta(s); renderList(s.lines); };
  const lineH4 = (i) => document.querySelectorAll('div[style*="padding-top: 191px"] > div > h4')[i];
  window.resetText = (i, text) => { const h = lineH4(i); h.textContent = text ?? h.firstChild.nodeValue; }; // React setTextContent
  window.setNodeValue = (i, text) => { lineH4(i).firstChild.nodeValue = text; };                         // React text-node update
  let tick = 0, cur = 0;
  setInterval(() => {                               // playback clock + moving active highlight (style attribute only)
    document.getElementById('clock').textContent = `tick ${++tick % 60}`;
    document.querySelectorAll('div[style*="padding-top: 191px"] > div > h4').forEach((h, i, all) => h.setAttribute('style', i === cur % all.length ? ACTIVE : H4_STYLE));
    cur++;
  }, 500);
  // Like a player that auto-scrolls: center line i using the rows' actual heights (sum of row boxes above it).
  window.scrollToLine = (i) => {
    const rows = [...document.querySelector('div[style*="padding-top: 191px"]').children], sc = document.getElementById('scroller') || document.querySelector('[tabindex="-1"].r-150rngu');
    let y = 191;
    for (let k = 0; k < i; k++) y += rows[k].offsetHeight + parseFloat(getComputedStyle(rows[k]).marginBottom);
    sc.scrollTop = y - sc.clientHeight / 2 + rows[i].offsetHeight / 2;
  };
  window.amltInserts = 0;                           // counts annotation blocks added (loop detection)
  new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((n) => { if (n.classList && n.classList.contains('amlt')) window.amltInserts++; })))
    .observe(document.body, { childList: true, subtree: true });
  setSong(Number(params.get('song') || 1));
  if (params.get('stage') === '0' || params.get('view') === 'closed' || params.get('mini') === '0') closeStage(); else openStage();
</script>
